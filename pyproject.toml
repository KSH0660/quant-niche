[project]
name = "quant-niche"
version = "0.1.0"
description = "회의주의 퀀트 워크벤치 — 사건성 수렴(near-arb) 라이브 추적 하네스"
readme = "README.md"
requires-python = ">=3.11"
# Layer 0(결정론 수집기)는 표준 라이브러리만 사용한다 — 어디서나 $0로 상시 구동.
# 가격은 Stooq CSV(키 불필요)를 urllib로 받는다. 외부 런타임 의존성 없음.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
quant-niche = "quant_niche.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_niche"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
